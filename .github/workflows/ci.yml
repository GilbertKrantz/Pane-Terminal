name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  PANE_FIXTURE_STARTUP_TIMEOUT_SECONDS: "5"
  PANE_FIXTURE_READINESS_TIMEOUT_SECONDS: "5"
  PANE_FIXTURE_ACTION_TIMEOUT_SECONDS: "5"
  PANE_FIXTURE_CLEANUP_TIMEOUT_SECONDS: "2"
  PANE_FIXTURE_TOTAL_TIMEOUT_SECONDS: "20"

jobs:
  integrity:
    name: Repository integrity
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Conflict markers, whitespace, and compatibility evidence
        run: Scripts/P2/check-integrity.sh

  swiftpm:
    name: SwiftPM standard and compatibility tests
    needs: integrity
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Select and verify pinned Xcode
        run: |
          Scripts/P2/select-ci-toolchain.sh

      - name: Configure fixture Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Export fixture Python path
        run: |
          fixture_python="$(python3 -c 'import sys; print(sys.executable)')"
          test -x "$fixture_python"
          printf 'PANE_FIXTURE_PYTHON=%s\n' "$fixture_python" >> "$GITHUB_ENV"
          "$fixture_python" --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run Pane standard tests
        run: |
          mkdir -p .ci/p2-artifacts
          set -o pipefail
          swift test --filter PaneTests \
            2>&1 | tee .ci/p2-artifacts/swiftpm-standard.log

      - name: Run short compatibility fixtures
        run: |
          mkdir -p .ci/p2-artifacts
          set -o pipefail
          swift test --filter PaneCompatibilityTests \
            2>&1 | tee .ci/p2-artifacts/swiftpm-compatibility.log

      - name: Capture sanitized runner metadata
        if: always()
        run: Scripts/P2/collect-ci-metadata.sh .ci/p2-artifacts

      - name: Upload SwiftPM diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Pane-SwiftPM-diagnostics
          path: .ci/p2-artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  xcode:
    name: Native Pane test targets
    needs: integrity
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Select and verify pinned Xcode
        run: |
          Scripts/P2/select-ci-toolchain.sh

      - name: Configure fixture Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Export fixture Python path
        run: |
          fixture_python="$(python3 -c 'import sys; print(sys.executable)')"
          test -x "$fixture_python"
          printf 'PANE_FIXTURE_PYTHON=%s\n' "$fixture_python" >> "$GITHUB_ENV"
          "$fixture_python" --version

      - name: Cache Xcode dependencies and build data
        uses: actions/cache@v5
        with:
          path: |
            .ci/DerivedData
            .ci/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('Pane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Run PaneTests
        run: |
          xcodebuild \
            -project Pane.xcodeproj \
            -scheme Pane \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath .ci/DerivedData \
            -clonedSourcePackagesDirPath .ci/SourcePackages \
            -resultBundlePath .ci/PaneTests.xcresult \
            -only-testing:PaneTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run app-hosted PaneCompatibilityTests non-parallel
        if: always()
        run: |
          xcodebuild \
            -project Pane.xcodeproj \
            -scheme Pane \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath .ci/DerivedData \
            -clonedSourcePackagesDirPath .ci/SourcePackages \
            -resultBundlePath .ci/PaneCompatibilityTests.xcresult \
            -only-testing:PaneCompatibilityTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture sanitized runner metadata
        if: always()
        run: Scripts/P2/collect-ci-metadata.sh .ci/p2-artifacts

      - name: Upload native result bundles and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Pane-native-test-artifacts
          path: |
            .ci/PaneTests.xcresult
            .ci/PaneCompatibilityTests.xcresult
            .ci/p2-artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
